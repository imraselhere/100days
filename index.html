<script>
const KEY="calendar100_v1";
let done=JSON.parse(localStorage.getItem(KEY)||"[]");
function toggleDay(n){ if(done.includes(n)) done=done.filter(x=>x!==n); else done.push(n); save(); }
function save(){localStorage.setItem(KEY,JSON.stringify(done)); render();}
function render(){
 document.querySelectorAll(".cell").forEach(c=>{
   const n=+c.dataset.day, ok=done.includes(n);
   c.classList.toggle("done",ok);
 });
 document.getElementById("status").textContent=`সম্পন্ন: ${done.length} / 100`;
}
function resetAll(){if(confirm("সব টিক মুছে ফেলবে?")){done=[];save();}}
render();

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>100 Day Challenge</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#111;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.header{
  background:#111;
  color:white;
  padding:22px;
  border-radius:20px;
  text-align:center;
  margin-bottom:15px;
}

.header h1{
  margin:0 0 10px;
  font-size:28px;
}

.progress{
  font-size:18px;
  margin-bottom:12px;
}

.bar{
  width:100%;
  height:12px;
  background:#444;
  border-radius:20px;
  overflow:hidden;
}

.fill{
  width:0%;
  height:100%;
  background:white;
  transition:0.3s;
}

.reset{
  margin-top:15px;
  padding:10px 16px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}

.day{
  background:white;
  margin-bottom:12px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 2px 8px #0001;
}

.day.complete{
  background:#eaffea;
}

.day-title{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:18px;
  margin-bottom:10px;
}

.task{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-top:1px solid #eee;
}

.task input{
  width:20px;
  height:20px;
}

.done{
  color:green;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <h1>🔥 100 Day Challenge</h1>

    <div class="progress" id="progress">
      সম্পন্ন: 0 / 100
    </div>

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>

    <button class="reset" onclick="resetAll()">
      সব টিক মুছে দাও
    </button>

  </div>

  <div id="days"></div>

</div>

<script>

const tasks = [
  "🏋️ Exercise",
  "🎥 ৩টা ভিডিও",
  "📚 নতুন কিছু শেখা"
];

const storageKey = "100DayChallenge";

let savedData =
  JSON.parse(localStorage.getItem(storageKey)) || {};

const daysContainer =
  document.getElementById("days");


/* 100 DAYS তৈরি */

for(let day = 1; day <= 100; day++){

  const dayBox = document.createElement("div");

  dayBox.className = "day";

  dayBox.id = "day-" + day;

  let html = `
    <div class="day-title">
      <span>Day ${day}</span>
      <span class="done" id="done-${day}"></span>
    </div>
  `;

  tasks.forEach((task,index)=>{

    html += `
      <label class="task">

        <input
          type="checkbox"
          data-day="${day}"
          data-task="${index}"
        >

        <span>${task}</span>

      </label>
    `;

  });

  dayBox.innerHTML = html;

  daysContainer.appendChild(dayBox);
}


/* আগের টিক লোড */

document.querySelectorAll("input[type=checkbox]")
.forEach(box=>{

  const day = box.dataset.day;
  const task = box.dataset.task;

  if(
    savedData[day] &&
    savedData[day][task]
  ){
    box.checked = true;
  }

  box.addEventListener("change",function(){

    if(!savedData[day]){
      savedData[day] = {};
    }

    savedData[day][task] =
      box.checked;

    localStorage.setItem(
      storageKey,
      JSON.stringify(savedData)
    );

    updateProgress();

  });

});


/* PROGRESS */

function updateProgress(){

  let completedDays = 0;

  for(let day=1; day<=100; day++){

    const boxes =
      document.querySelectorAll(
        `[data-day="${day}"]`
      );

    let complete = true;

    boxes.forEach(box=>{

      if(!box.checked){
        complete = false;
      }

    });

    const dayBox =
      document.getElementById(
        "day-" + day
      );

    const doneText =
      document.getElementById(
        "done-" + day
      );

    if(complete){

      completedDays++;

      dayBox.classList.add("complete");

      doneText.textContent = "✓ সম্পন্ন";

    }else{

      dayBox.classList.remove("complete");

      doneText.textContent = "";

    }

  }

  document.getElementById("progress")
  .textContent =
    `সম্পন্ন: ${completedDays} / 100`;

  document.getElementById("fill")
  .style.width =
    completedDays + "%";
}


/* RESET */

function resetAll(){

  const confirmReset =
    confirm("সব টিক মুছে ফেলবে?");

  if(!confirmReset) return;

  savedData = {};

  localStorage.removeItem(
    storageKey
  );

  document
    .querySelectorAll("input[type=checkbox]")
    .forEach(box=>{
      box.checked = false;
    });

  updateProgress();

  window.scrollTo(0,0);
}


/* শুরুতে Progress দেখাবে */

updateProgress();

</script>

</body>
</html>

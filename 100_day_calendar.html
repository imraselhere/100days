<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>১০০ দিনের ক্যালেন্ডার</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#f3f4f6;font-family:Arial,sans-serif;color:#222}
  header{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(4px);padding:16px 14px 12px;text-align:center;box-shadow:0 2px 8px #0001;z-index:5}
  h1{margin:0 0 8px;font-size:25px}
  #status{font-size:15px;font-weight:700}
  .progress-wrap{max-width:420px;margin:8px auto 6px;background:#eef2f7;border-radius:999px;overflow:hidden;height:12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
  .progress-bar{width:0%;height:100%;background:linear-gradient(90deg,#58b368,#37a0ff);border-radius:999px;transition:width .25s ease}
  .progress-meta{display:flex;justify-content:center;gap:8px;font-size:12px;color:#4b5563;margin-bottom:6px}
  .wrap{max-width:700px;margin:auto;padding:14px}
  .month{background:white;border-radius:16px;padding:14px;margin:14px 0;box-shadow:0 2px 10px #00000010}
  h2{text-align:center;margin:2px 0 12px;font-size:21px}
  .week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .week div{text-align:center;font-size:12px;font-weight:bold;padding:4px;color:#485563}
  .cell,.blank{min-height:64px;border-radius:9px}
  .cell{border:1px solid #ddd;background:#fafafa;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
  .cell:hover{transform:translateY(-1px);border-color:#8bb7ff;box-shadow:0 2px 8px rgba(64,123,255,.12)}
  .cell:focus-visible{outline:3px solid rgba(59,130,246,.5);outline-offset:2px}
  .cell b{font-size:18px;line-height:1}
  .cell small{font-size:9px;margin-top:2px;color:#4b5563}
  .cell span{font-size:18px;margin-top:2px;line-height:1}
  .cell.today{border-color:#f59e0b;box-shadow:inset 0 0 0 2px rgba(245,158,11,.18)}
  .cell.done{background:#dff5e3;border-color:#55a763;box-shadow:inset 0 0 0 1px rgba(85,167,99,.2)}
  .cell.done span{font-size:0}
  .cell.done span:after{content:"✓";font-size:20px;font-weight:bold;color:#1f7a35}
  .blank{background:transparent}
  button.reset{margin:8px 0 4px;padding:9px 14px;border:0;border-radius:8px;background:#222;color:white;cursor:pointer;font-weight:700}
  @media(max-width:430px){.wrap{padding:8px}.month{padding:9px}.cell,.blank{min-height:58px}.cell b{font-size:16px}h1{font-size:22px}}
</style>
</head>
<body>
<header>
  <h1>📅 ১০০ দিনের ক্যালেন্ডার</h1>
  <div id="status">সম্পন্ন: 0 / 100</div>
  <div class="progress-wrap" aria-label="প্রগ্রেস">
    <div id="progress-bar" class="progress-bar"></div>
  </div>
  <div class="progress-meta"><span id="progress-text">0%</span><span>সম্পূর্ণ</span></div>
  <button class="reset" onclick="resetAll()">সব টিক মুছে দাও</button>
</header>
<div class="wrap" id="calendar-wrap"></div>

<script>
const KEY = "calendar100_v1";
const TOTAL_DAYS = 100;
const WEEKDAYS = ["রবি","সোম","মঙ্গল","বুধ","বৃহস্পতি","শুক্র","শনি"];
const MONTH_NAMES = ["সেপ্টেম্বর 2026","অক্টোবর 2026","নভেম্বর 2026","ডিসেম্বর 2026"];
let done = [];

function safeLoad() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "[]");
    const values = Array.isArray(raw) ? raw : [];
    done = [...new Set(values.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= TOTAL_DAYS))];
  } catch (e) {
    done = [];
  }
}

function getCurrentDayNumber() {
  const start = new Date(2026, 8, 1);
  const today = new Date();
  const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
  if (diff < 0) return 0;
  if (diff >= TOTAL_DAYS) return TOTAL_DAYS;
  return diff + 1;
}

function buildCalendar() {
  const wrap = document.getElementById("calendar-wrap");
  const monthMap = new Map();
  let dayNumber = 1;

  for (let monthIndex = 8; monthIndex <= 11; monthIndex++) {
    const daysInMonth = new Date(2026, monthIndex + 1, 0).getDate();
    const items = [];
    for (let day = 1; day <= daysInMonth && dayNumber <= TOTAL_DAYS; day++) {
      items.push({ dayNumber: dayNumber, date: day });
      dayNumber++;
    }
    monthMap.set(monthIndex, items);
  }

  wrap.innerHTML = [8,9,10,11].map((monthIndex, idx) => {
    const monthEntries = monthMap.get(monthIndex) || [];
    const firstDay = new Date(2026, monthIndex, 1).getDay();
    const cells = [];

    for (let i = 0; i < firstDay; i++) cells.push('<div class="blank"></div>');

    monthEntries.forEach(({ dayNumber: seq, date }) => {
      const checked = done.includes(seq);
      const isToday = seq === getCurrentDayNumber();
      cells.push(`
        <button
          class="cell ${checked ? 'done' : ''} ${isToday ? 'today' : ''}"
          type="button"
          data-day="${seq}"
          aria-pressed="${checked ? 'true' : 'false'}"
          onclick="toggleDay(${seq})"
        >
          <b>${date}</b>
          <small>Day ${seq}</small>
          <span>${checked ? '✓' : '☐'}</span>
        </button>
      `);
    });

    return `
      <section class="month">
        <h2>${MONTH_NAMES[idx]}</h2>
        <div class="week">${WEEKDAYS.map(day => `<div>${day}</div>`).join('')}</div>
        <div class="grid">${cells.join('')}</div>
      </section>
    `;
  }).join('');
}

function toggleDay(n) {
  const value = Number(n);
  if (!Number.isInteger(value) || value < 1 || value > TOTAL_DAYS) return;
  if (done.includes(value)) done = done.filter(x => x !== value);
  else done.push(value);
  save();
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(done));
  render();
}

function render() {
  const status = document.getElementById('status');
  const progressBar = document.getElementById('progress-bar');
  const progressText = document.getElementById('progress-text');
  const completed = done.length;
  const percentage = Math.round((completed / TOTAL_DAYS) * 100);

  status.textContent = `সম্পন্ন: ${completed} / ${TOTAL_DAYS}`;
  progressBar.style.width = `${percentage}%`;
  progressText.textContent = `${percentage}%`;

  document.querySelectorAll('.cell').forEach(cell => {
    const n = Number(cell.dataset.day);
    const checked = done.includes(n);
    cell.classList.toggle('done', checked);
    cell.setAttribute('aria-pressed', checked ? 'true' : 'false');
    const indicator = cell.querySelector('span');
    if (indicator) indicator.textContent = checked ? '✓' : '☐';
  });
}

function resetAll(){
  if(confirm('সব টিক মুছে ফেলবে?')){
    done=[];
    save();
  }
}

safeLoad();
buildCalendar();
render();
</script>
</body>
</html>
